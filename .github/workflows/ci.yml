name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "experiment/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run approval policy evaluations
        run: python evals/run_local.py
