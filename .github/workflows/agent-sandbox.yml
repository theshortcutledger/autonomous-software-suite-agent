name: Autonomous issue runner

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub Issue number to implement"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run guarded issue agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.AGENT_MODEL || 'gpt-5.6' }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          uv sync
          bash scripts/run_issue_agent.sh "$ISSUE_NUMBER"
